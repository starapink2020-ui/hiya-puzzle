  <style>
:root{
  /* Layout: one full-height app. Screens swap in place; the play screen is a toolbar plus a stage whose board and tray are measured in JS. */
  --sky:#dff3ff; --blue:#1d7fc4; --blue-d:#14609b;
  --sun:#ffd95a; --sun-d:#e0a410;
  --mint:#c9f2dc; --mint-d:#56c58f; --mint-dd:#2f9d6c;
  --ink:#23425e; --pink:#e0457f; --card:#ffffff; --line:#b9dcf2;
  --f-display:"Baloo Bhaijaan 2","Cairo",Tahoma,"Segoe UI",system-ui,sans-serif;
  --f-body:"Cairo","Baloo Bhaijaan 2",Tahoma,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background-color:var(--sky);
  background-image:linear-gradient(180deg,var(--sky) 0%,#f4fbff 52%,var(--mint) 100%);
  background-attachment:fixed;color:var(--ink);
  font:800 18px/1.45 var(--f-body);
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
}
#app{height:100%;position:relative;z-index:1;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;overflow-y:auto}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg svg{position:absolute;fill:#fff;opacity:.9}
.bg .c1{width:150px;top:6%;left:6%;animation:drift 14s ease-in-out infinite alternate}
.bg .c2{width:110px;top:16%;right:8%;animation:drift 11s ease-in-out infinite alternate-reverse}
.bg .c3{width:130px;bottom:12%;left:12%;opacity:.7;animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(28px)}}

/* buttons */
.btn{
  font:inherit;font-weight:800;border:0;border-radius:999px;cursor:pointer;
  min-height:52px;padding:.45em 1.1em;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  color:var(--ink);background:#fff;box-shadow:0 5px 0 #b8d6ea;
  transition:transform .1s,box-shadow .1s;
}
.btn svg{width:1.3em;height:1.3em;flex:none}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b8d6ea}
.btn:focus-visible,.pick:focus-visible,.count:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.btn-sun{background:var(--sun);box-shadow:0 6px 0 var(--sun-d)}
.btn-sun:active{box-shadow:0 1px 0 var(--sun-d)}
.btn-blue{background:var(--blue-d);color:#fff;box-shadow:0 6px 0 #0d4670}
.btn-blue:active{box-shadow:0 1px 0 #0d4670}
.btn-mint{background:var(--mint-d);box-shadow:0 5px 0 var(--mint-dd)}
.btn-mint:active{box-shadow:0 1px 0 var(--mint-dd)}
.btn-big{font-family:var(--f-display);font-size:clamp(1.7rem,6vw,2.3rem);min-height:76px;padding:.3em 1.5em}

/* welcome */
.welcome-inner{margin:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3.4vh,30px);text-align:center;padding:10px 0}
h1{
  margin:0;font:800 clamp(2.5rem,10vw,4.8rem)/1.15 var(--f-display);color:var(--blue-d);
  text-shadow:0 3px 0 #fff,0 7px 0 rgba(20,96,155,.16);text-wrap:balance;
}
h1 span{color:var(--pink)}
.hero{position:relative;width:min(340px,72vw,40vh);aspect-ratio:4/3}
.hp{position:absolute;animation:join 3s ease-in-out infinite alternate}
.hp svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 5px 5px rgba(35,66,94,.3))}
@keyframes join{from{transform:translate(var(--dx),var(--dy))}to{transform:translate(0,0)}}

/* selection */
.select-inner{margin:auto;width:min(980px,100%);display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.2vh,18px);padding:6px 0}
.row-top{width:100%;display:flex;justify-content:flex-start}
h2{text-wrap:balance;margin:0;font:800 clamp(1.6rem,5vw,2.4rem)/1.2 var(--f-display);color:var(--blue-d);text-align:center}
.counts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.count{
  font:inherit;font-weight:800;cursor:pointer;width:104px;padding:8px 6px 6px;border-radius:24px;
  background:#fff;color:var(--ink);border:4px solid #fff;box-shadow:0 5px 0 #b8d6ea;
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s;
}
.count:hover{transform:translateY(-2px)}
.count[aria-pressed="true"]{background:var(--sun);border-color:var(--ink);box-shadow:0 5px 0 var(--sun-d)}
.count .num{font:800 1.9rem/1 var(--f-display)}
.count .lbl{font-size:.95rem}
.mini{display:grid;gap:3px;width:44px;height:33px}
.mini i{background:var(--blue);border-radius:3px;opacity:.85}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;width:100%}
.pick.add{border:5px dashed var(--blue);background:#f2faff;box-shadow:0 7px 0 #b8d6ea}
.pick .ph{width:100%;aspect-ratio:4/3;border-radius:20px;display:grid;place-items:center;color:var(--blue-d);background:#fff}
.pick .ph svg{width:44%;border-radius:0;background:none}
.upmsg{margin:0;min-height:1.4em;color:#b3261e;text-align:center}
.pick{
  font:inherit;cursor:pointer;background:#fff;color:var(--ink);border:5px solid #fff;border-radius:30px;
  padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
  box-shadow:0 7px 0 #b8d6ea;transition:transform .12s,border-color .12s;min-width:0;
}
.pick:hover{transform:translateY(-5px);border-color:var(--sun)}
.pick:active{transform:translateY(2px)}
.pick svg{width:100%;display:block;border-radius:20px;background:#fff}
.pick b{font:800 clamp(1.15rem,2.6vw,1.6rem)/1.2 var(--f-display)}
@media (max-width:640px){
  .picks{grid-template-columns:1fr;gap:12px}
  .pick{flex-direction:row;padding:8px 12px 8px 8px;gap:12px;border-radius:26px}
  .pick svg,.pick .ph{width:46%}
  .pick .ph svg{width:44%}
  .pick b{flex:1;text-align:center;font-size:1.35rem}
}

/* play */
.bar{width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 0 10px}
.bar .grow{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.bar .btn{min-height:50px;padding:.3em .95em;font-size:1rem}
.bar .thumb{padding:4px 10px 4px 4px;gap:8px}
.bar .thumb svg{width:56px;height:auto;border-radius:10px;flex:none}
.stage{flex:1;min-height:0;width:100%;position:relative;direction:ltr;touch-action:none;overflow:hidden}
.tray{position:absolute;border-radius:28px;background:rgba(255,255,255,.55);border:4px dashed rgba(29,127,196,.38)}
.frame{position:absolute;border-radius:26px;background:#fff;box-shadow:0 8px 0 rgba(35,66,94,.14)}
.board{position:absolute;border-radius:16px;overflow:hidden;display:block}
.slot{fill:#ffd95a;fill-opacity:0;stroke:#2c7fb8;stroke-opacity:.6;stroke-width:3;stroke-dasharray:9 7;stroke-linejoin:round}
.slot.done{opacity:0}
.slot.hint{animation:slotPulse .9s ease-in-out infinite;stroke:#e0a410;stroke-opacity:1;stroke-dasharray:none;stroke-width:5}
@keyframes slotPulse{0%,100%{fill-opacity:.25}50%{fill-opacity:.85}}
.piece{position:absolute;left:0;top:0;transform-origin:50% 50%;touch-action:none;cursor:grab;will-change:transform;z-index:10}
.piece svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none;filter:drop-shadow(0 4px 5px rgba(35,66,94,.38))}
.piece.settle{transition:transform .28s cubic-bezier(.2,.9,.3,1.15)}
.piece.drag{cursor:grabbing}
.piece.drag svg{filter:drop-shadow(0 14px 12px rgba(35,66,94,.4))}
.piece.placed{pointer-events:none;cursor:default}
.piece.placed svg{filter:none;animation:pop .45s}
.piece.wobble svg{animation:wobble .5s}
.piece.hint svg{animation:glow .9s ease-in-out infinite}
@keyframes pop{40%{transform:scale(1.1)}}
@keyframes wobble{20%{transform:rotate(-9deg)}50%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
@keyframes glow{
  0%,100%{filter:drop-shadow(0 0 4px #ffd95a) drop-shadow(0 4px 5px rgba(35,66,94,.38))}
  50%{filter:drop-shadow(0 0 16px #e0a410) drop-shadow(0 0 8px #ffd95a)}
}
.toast{
  position:absolute;left:50%;bottom:6px;transform:translate(-50%,16px);z-index:400;width:max-content;max-width:94%;
  background:var(--ink);color:#fff;padding:.5em 1.2em;border-radius:999px;text-align:center;direction:rtl;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:rgba(35,66,94,.5);padding:16px}
.card{
  position:relative;z-index:2;background:#fff;border-radius:32px;padding:clamp(14px,3vw,26px);
  width:min(540px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;
  text-align:center;box-shadow:0 10px 0 rgba(35,66,94,.2);animation:cardIn .5s cubic-bezier(.2,1.2,.3,1);
}
.card h2{font-size:clamp(1.7rem,6vw,2.5rem)}
.card .pic{width:100%;max-width:380px;max-height:36vh;border-radius:20px;display:block}
.stars{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.stars svg{width:clamp(54px,14vw,84px);animation:starIn .6s cubic-bezier(.2,1.4,.3,1) both}
.stars svg:nth-child(2){width:clamp(70px,18vw,108px);animation-delay:.15s;margin-bottom:12px}
.stars svg:nth-child(3){animation-delay:.3s}
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
#confetti i{position:absolute;top:-30px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(var(--r))}}
@keyframes cardIn{from{transform:scale(.7);opacity:0}}
@keyframes starIn{from{transform:scale(0) rotate(-90deg);opacity:0}}

@media (max-width:520px){
  .bar{gap:6px}
  .bar .btn{padding:.25em .7em;font-size:.95rem;min-height:48px}
  .bar .thumb{padding:3px 8px 3px 3px}
  .bar .thumb svg{width:46px}
  .bar .grow{gap:6px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #confetti{display:none}
}
</style>

const butterfly=()=>{

/* ---------- jigsaw geometry ---------- */
function geom(rows,cols){const cw=W/cols,ch=H/rows,k=.22*Math.min(cw,ch);return{rows,cols,cw,ch,k,t:k*1.12};}
function makeEdges(rows,cols){
  const rnd=()=>Math.random()<.5?1:-1,hs=[],vs=[];
  for(let r=0;r<=rows;r++){hs.push([]);for(let c=0;c<cols;c++)hs[r].push(r===0||r===rows?0:rnd());}
  for(let r=0;r<rows;r++){vs.push([]);for(let c=0;c<=cols;c++)vs[r].push(c===0||c===cols?0:rnd());}
  return{hs,vs};
}
function edge(ax,ay,bx,by,s,k){
  if(!s)return`L${bx} ${by}`;
  const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=uy,ny=-ux;
  const P=(a,b)=>`${(ax+ux*L*a+nx*k*b*s).toFixed(1)} ${(ay+uy*L*a+ny*k*b*s).toFixed(1)}`;
  return`L${P(.38,0)}C${P(.38,.35)} ${P(.3,.55)} ${P(.3,.8)}C${P(.3,1.05)} ${P(.4,1)} ${P(.5,1)}C${P(.6,1)} ${P(.7,1.05)} ${P(.7,.8)}C${P(.7,.55)} ${P(.62,.35)} ${P(.62,0)}L${bx} ${by}`;
}
function piecePath(r,c,g,E){
  const x0=c*g.cw,y0=r*g.ch,x1=x0+g.cw,y1=y0+g.ch,k=g.k;
  return`M${x0} ${y0}`+edge(x0,y0,x1,y0,-E.hs[r][c],k)+edge(x1,y0,x1,y1,E.vs[r][c+1],k)+edge(x1,y1,x0,y1,E.hs[r+1][c],k)+edge(x0,y1,x0,y0,-E.vs[r][c],k)+'Z';
}
function pieceSVG(key,r,c,g,E,uid){
  const d=piecePath(r,c,g,E),x=c*g.cw-g.t,y=r*g.ch-g.t;
  return`<svg viewBox="${x.toFixed(1)} ${y.toFixed(1)} ${(g.cw+2*g.t).toFixed(1)} ${(g.ch+2*g.t).toFixed(1)}" aria-hidden="true"><defs><clipPath id="cp${uid}"><path d="${d}"/></clipPath></defs><g clip-path="url(#cp${uid})"><use href="#art-${key}"/></g><path d="${d}" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="3" stroke-linejoin="round"/></svg>`;
}

/* ---------- sound ---------- */
let ac=null,soundOn=true;
function tone(f,t0,dur,type,vol){
  if(!soundOn)return;
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}

/* ---------- game ---------- */
const stage=$('#stage');
function startGame(key,n){
  clearHint();clearTimeout(winTimer);$('#win').hidden=true;dragging=null;
  const [rows,cols]=SIZES[n],g=geom(rows,cols),E=makeEdges(rows,cols),uid=++uidN;
  stage.querySelectorAll('.piece,.tray,.frame,.board').forEach(x=>x.remove());
  const tray=document.createElement('div');tray.className='tray';
  const frame=document.createElement('div');frame.className='frame';
  const board=document.createElement('div');board.className='board';
  let slots='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)slots+=`<path class="slot" data-i="${r*cols+c}" d="${piecePath(r,c,g,E)}"/>`;
  board.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" aria-hidden="true" style="display:block"><rect width="${W}" height="${H}" fill="#fff"/><g opacity=".3"><use href="#art-${key}"/></g>${slots}</svg>`;
  stage.prepend(board);stage.prepend(frame);stage.prepend(tray);
  const pieces=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const el=document.createElement('div');el.className='piece';el.dataset.r=r;el.dataset.c=c;
    el.innerHTML=pieceSVG(key,r,c,g,E,`${uid}_${r}_${c}`);
    const p={r,c,i:r*cols+c,el,placed:false,cx:0,cy:0,sc:1};
    bindDrag(p);stage.appendChild(el);pieces.push(p);
  }
  for(let i=pieces.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pieces[i],pieces[j]]=[pieces[j],pieces[i]];}
  game={key,n,g,rows,cols,pieces,tray,frame,board,L:null};
  $('#thumb').innerHTML=artSvg(key);
  show('s-play');
  requestAnimationFrame(()=>{layoutAll();toast('اسحب كل قطعة إلى مكانها',3500);});
}

function computeLayout(SW,SH){
  const g=game.g,m=10,fp=8,gap=10,land=SW/SH>=1.25;
  let bw,bx,by,tray;
  if(land){
    bw=Math.min((SW-2*m-2*fp)*.58,(SH-2*m-2*fp)*W/H);
    const bh=bw*H/W;bx=SW-m-fp-bw;by=(SH-bh)/2;
    tray={x:m,y:m,w:bx-fp-gap-m,h:SH-2*m};
  }else{
    bw=Math.min(SW-2*m-2*fp,(SH-2*m-2*fp)*.52*W/H);
    const bh=bw*H/W;bx=(SW-bw)/2;by=m+fp;
    const ty=by+bh+fp+gap;
    tray={x:m,y:ty,w:SW-2*m,h:SH-m-ty};
  }
  const s=bw/W;
  return{s,bx,by,bw,bh:bw*H/W,fp,tray,pw:(g.cw+2*g.t)*s,ph:(g.ch+2*g.t)*s,snap:Math.min(g.cw,g.ch)*s*.5};
}
function trayLayout(L,n){
  const g=game.g,ew=(g.cw+g.t)*L.s,eh=(g.ch+g.t)*L.s,T=L.tray;
  let ts=.9,cols=1,rows=n;
  for(let i=0;i<=10;i++){
    ts=.9-i*.05;cols=Math.max(1,Math.floor(T.w/(ew*ts)));rows=Math.ceil(n/cols);
    if(rows*eh*ts<=T.h)break;
  }
  const stepY=rows>1?Math.min(eh*ts,(T.h-eh*ts)/(rows-1)):0;
  const y0=T.y+(T.h-(eh*ts+(rows-1)*stepY))/2,pos=[];
  for(let i=0;i<n;i++){
    const r=Math.floor(i/cols),inRow=Math.min(cols,n-r*cols),idx=i-r*cols;
    const x0=T.x+(T.w-inRow*ew*ts)/2;
    pos.push({x:x0+(idx+.5)*ew*ts+(Math.random()-.5)*6,y:y0+eh*ts/2+r*stepY+(Math.random()-.5)*6});
  }
  return{ts,pos};
}
const target=p=>({x:game.L.bx+(p.c+.5)*game.g.cw*game.L.s,y:game.L.by+(p.r+.5)*game.g.ch*game.L.s});
function place(p){p.el.style.transform=`translate(${(p.cx-game.L.pw/2).toFixed(1)}px,${(p.cy-game.L.ph/2).toFixed(1)}px) scale(${p.sc})`;}
function box(el,x,y,w,h){el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=h+'px';}

function layoutAll(){
  if(!game)return;
  const SW=stage.clientWidth,SH=stage.clientHeight;if(!SW||!SH)return;
  const L=game.L=computeLayout(SW,SH);
  box(game.frame,L.bx-L.fp,L.by-L.fp,L.bw+2*L.fp,L.bh+2*L.fp);
  box(game.board,L.bx,L.by,L.bw,L.bh);
  box(game.tray,L.tray.x,L.tray.y,Math.max(0,L.tray.w),Math.max(0,L.tray.h));
  const loose=game.pieces.filter(p=>!p.placed),T=trayLayout(L,loose.length);
  L.ts=T.ts;
  loose.forEach((p,i)=>{p.cx=T.pos[i].x;p.cy=T.pos[i].y;p.sc=T.ts;});
  game.pieces.forEach(p=>{
    const el=p.el;el.style.width=L.pw+'px';el.style.height=L.ph+'px';
    el.classList.remove('settle');
    if(p.placed){const t=target(p);p.cx=t.x;p.cy=t.y;p.sc=1;}
    place(p);
  });
}
new ResizeObserver(()=>{if(game&&!dragging&&!$('#s-play').hidden)layoutAll();}).observe(stage);

/* ---------- drag and drop ---------- */
function bindDrag(p){
  const el=p.el;
  el.addEventListener('pointerdown',e=>{
    if(p.placed||dragging||(e.pointerType==='mouse'&&e.button!==0))return;
    e.preventDefault();
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    const sr=stage.getBoundingClientRect(),px=e.clientX-sr.left,py=e.clientY-sr.top;
    p.pid=e.pointerId;p.ox=(px-p.cx)/p.sc;p.oy=(py-p.cy)/p.sc;
    dragging=p;
    el.classList.add('drag','settle');el.style.zIndex=++zTop;
    if(el.classList.contains('hint'))clearHint();
    p.sc=1;p.cx=px-p.ox;p.cy=py-p.oy;place(p);
    setTimeout(()=>{if(dragging===p)el.classList.remove('settle');},170);
  });
  el.addEventListener('pointermove',e=>{
    if(dragging!==p||e.pointerId!==p.pid)return;
    const sr=stage.getBoundingClientRect();
    p.cx=Math.max(0,Math.min(sr.width,e.clientX-sr.left-p.ox));
    p.cy=Math.max(0,Math.min(sr.height,e.clientY-sr.top-p.oy));
    place(p);
  });
  const end=e=>{if(dragging!==p||e.pointerId!==p.pid)return;drop(p);};
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
}
function drop(p){
  dragging=null;
  const el=p.el,L=game.L,t=target(p);
  el.classList.remove('drag');el.classList.add('settle');
  if(Math.hypot(p.cx-t.x,p.cy-t.y)<L.snap){
    p.placed=true;p.cx=t.x;p.cy=t.y;p.sc=1;
    el.classList.add('placed');el.style.zIndex=5;
    game.board.querySelector(`.slot[data-i="${p.i}"]`).classList.add('done');
    place(p);sndSnap();
    if(game.pieces.every(q=>q.placed)){clearHint();winTimer=setTimeout(showWin,700);}
  }else{
    const onBoard=p.cx>L.bx&&p.cx<L.bx+L.bw&&p.cy>L.by&&p.cy<L.by+L.bh;
    if(!onBoard)p.sc=L.ts;
    else{el.classList.remove('wobble');void el.offsetWidth;el.classList.add('wobble');sndMiss();}
    place(p);
  }
}

/* ---------- hint ---------- */
function clearHint(){
  clearTimeout(hintTimer);
  document.querySelectorAll('.piece.hint,.slot.hint').forEach(x=>x.classList.remove('hint'));
}
function hint(){
  if(!game)return;
  const loose=game.pieces.filter(p=>!p.placed);if(!loose.length)return;
  clearHint();
  const p=loose[Math.floor(Math.random()*loose.length)];
  p.el.classList.add('hint');p.el.style.zIndex=++zTop;
  game.board.querySelector(`.slot[data-i="${p.i}"]`).classList.add('hint');
  toast('ضع القطعة المضيئة في المكان المضيء',4200);
  hintTimer=setTimeout(clearHint,4500);
}

/* ---------- win ---------- */
function showWin(){
  clearTimeout(toastTimer);$('#toast').classList.remove('show');
  $('#winPic').innerHTML=artSvg(game.key,'pic');
  const box=$('#confetti');box.innerHTML='';
  const cols=['#ffd95a','#ff9fbd','#4ab3f4','#5fcf99','#b9a6ff','#ffb36b'];
  for(let i=0;i<70;i++){
    const d=document.createElement('i'),s=d.style;
    s.left=Math.random()*100+'%';s.background=cols[i%cols.length];
    s.width=8+Math.random()*8+'px';s.height=10+Math.random()*10+'px';
    s.animationDuration=2.6+Math.random()*2.4+'s';s.animationDelay=Math.random()*1.2+'s';
    s.setProperty('--r',Math.random()*720-360+'deg');
    if(i%3===0)s.borderRadius='50%';
    box.appendChild(d);
  }
  $('#win').hidden=false;sndWin();
  setTimeout(()=>{try{$('#again').focus({preventScroll:true});}catch(_){}},60);
}

/* ---------- buttons ---------- */
$('#back').addEventListener('click',()=>{clearHint();show('s-select');});
$('#again').addEventListener('click',()=>{$('#win').hidden=true;show('s-select');});
$('#restart').addEventListener('click',()=>{if(game)startGame(game.key,game.n);});
$('#hint').addEventListener('click',hint);
$('#peekBtn').addEventListener('click',()=>{if(!game)return;$('#peekPic').innerHTML=artSvg(game.key,'pic');$('#peekPic svg').style.cssText='width:100%;border-radius:20px;display:block';$('#peek').hidden=false;});
$('#peekClose').addEventListener('click',()=>{$('#peek').hidden=true;});
$('#peek').addEventListener('click',e=>{if(e.target.id==='peek')$('#peek').hidden=true;});
$('#sound').addEventListener('click',()=>{
  soundOn=!soundOn;$('#sound').setAttribute('aria-pressed',String(soundOn));
  $('#snd-on').hidden=!soundOn;$('#snd-off').hidden=soundOn;
  if(soundOn)sndSnap();
});
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => {
      console.warn('تعذر تفعيل العمل دون إنترنت:', err);
    });
  });
}
</script>
